<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>Weekend Trip | Tim Bootle</title>
  <script src="../js/https-redirect.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .pick-card {
      max-width: 36rem;
      margin: 12vh auto 0;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 24px rgba(19, 32, 51, 0.06);
      text-align: center;
    }
    .pick-card h1 { margin: 0 0 12px; font-size: 1.75rem; }
    .pick-card p { margin: 0 0 18px; color: var(--ink-500); }
    .pick-card a { color: var(--blue-500); font-weight: 700; text-decoration: none; }
    .pick-card a:hover { text-decoration: underline; }
  </style>
  <script>
    (function () {
      var TAG = "overnight";
      var FALLBACK = ["wormsloe-historic-site-bonaventure", "savannah-historic-squares-and-forsyth-park", "tybee-island-light-station-fort-pulaski", "daufuskie-island-golf-cart-excursion", "harbour-town-lighthouse-pinckney-island", "jekyll-island-driftwood-beach-sea-turtle-center", "st-simons-island-lighthouse-fort-frederica", "cumberland-island-national-seashore", "okefenokee-swamp-boat-tour", "hitchcock-woods-and-hopelands-gardens", "augusta-canal-heritage-boat-tour-riverwalk", "biltmore-estate-and-antler-hill-village", "blue-ridge-parkway-craggy-gardens-mount-mitchell", "sierra-nevada-brewing-river-arts-district", "dupont-state-recreational-forest", "sliding-rock-and-looking-glass-falls", "carl-sandburg-home", "dry-falls-and-bridal-veil-falls", "whitewater-falls-and-gorges-state-park", "grandfather-mountain-and-mile-high-swinging-bridge", "the-blowing-rock-moses-h-cone", "linville-gorge-and-linville-caverns", "great-smoky-mountains-railroad-deep-creek", "oconaluftee-elk-viewing-and-mingo-falls", "falls-park-on-the-reedy-swamp-rabbit-trail", "caesars-head-raven-cliff-falls", "table-rock-sassafras-mountain", "us-national-whitewater-center", "nascar-hall-of-fame-charlotte-motor-speedway", "north-carolina-transportation-museum", "battleship-north-carolina-wilmington-riverwalk", "fort-fisher-nc-aquarium", "bald-head-island-day-ferry", "tallulah-gorge-state-park", "helen-alpine-village-and-anna-ruby-falls", "dahlonega-gold-museum-north-georgia-wineries"];
      var SELF = "/weekendtrip/";

      function go(slugs) {
        if (!slugs || !slugs.length) {
          window.location.replace("/localadventures/");
          return;
        }
        var i = Math.floor(Math.random() * slugs.length);
        window.location.replace("/localadventures/" + slugs[i] + "/");
      }

      function fromTags(data) {
        var slugs = [];
        var trips = (data && data.trips) || {};
        Object.keys(trips).forEach(function (id) {
          var trip = trips[id];
          if (!trip || !trip.slug || !trip.tags) return;
          if (trip.tags.indexOf(TAG) !== -1) slugs.push(trip.slug);
        });
        return slugs;
      }

      fetch("/localadventures/tags.json", { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("tags");
          return res.json();
        })
        .then(function (data) {
          var slugs = fromTags(data);
          go(slugs.length ? slugs : FALLBACK);
        })
        .catch(function () { go(FALLBACK); });

      window.addEventListener("DOMContentLoaded", function () {
        var link = document.getElementById("pick-another");
        if (link) link.setAttribute("href", SELF);
      });
    })();
  </script>
</head>
<body>
  <main>
    <div class="container">
      <div class="pick-card">
        <h1>Picking a trip…</h1>
        <p>Opening a random weekend getaway.</p>
        <p><a id="pick-another" href="/weekendtrip/">Pick another</a></p>
        <noscript>
          <p><a href="/localadventures/">Browse all local adventures</a></p>
        </noscript>
      </div>
    </div>
  </main>
</body>
</html>
