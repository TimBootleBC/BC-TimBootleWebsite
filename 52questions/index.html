<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation Cards</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #232734;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --accent: #6b9fff;
  --accent-hover: #5a8ae8;
  --follow: #a8b8ff;
  --border: #2e3340;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 { margin: 0 0 4px; font-size: 1.5rem; }
.subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
.container { width: 100%; max-width: 640px; }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 16px;
}
.card-box {
  background: var(--surface2);
  border-radius: 12px;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 36px 28px;
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: background 0.15s;
}
.card-box:active { background: #2a2f3d; }
.question {
  font-size: 1.35rem;
  line-height: 1.45;
  font-weight: 500;
}
.followup {
  margin-top: 20px;
  font-size: 1.05rem;
  color: var(--follow);
  line-height: 1.4;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 0.25s, max-height 0.3s;
}
.followup.visible {
  opacity: 1;
  max-height: 200px;
}
.side-label {
  position: absolute;
  top: 14px;
  left: 18px;
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: var(--accent-hover); }
button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
button.secondary:hover { background: #2a2f3d; }
.stats { color: var(--muted); font-size: 0.88rem; text-align: center; margin-bottom: 10px; }
.deck-select { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
.deck-btn {
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 16px;
  font-size: 0.88rem;
  font-weight: 600;
}
.deck-btn:hover { background: #2a2f3d; color: var(--text); }
.deck-btn.is-active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.deck-btn.is-active:hover { background: var(--accent-hover); }
.progress-bar {
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  margin: 8px 0 14px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.2s;
}
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <h1>Conversation Cards</h1>
  <p class="subtitle" id="subtitle">Conversation deck (52 cards). Tap for follow-up. No right answers.</p>

  <div id="studyPanel" class="panel">
    <div class="deck-select" id="deckSelect" role="group" aria-label="Choose a deck">
      <button type="button" class="deck-btn is-active" data-deck="conversation" onclick="selectDeck('conversation')">Conversation</button>
      <button type="button" class="deck-btn" data-deck="rsd" onclick="selectDeck('rsd')">ADHD / RSD</button>
      <button type="button" class="deck-btn" data-deck="vacation" onclick="selectDeck('vacation')">Vacation</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="card-box" id="cardBox" onclick="revealFollowup()">
      <span class="side-label" id="sideLabel">Question</span>
      <div class="question" id="questionText"></div>
      <div class="followup" id="followupText"></div>
    </div>

    <div class="controls">
      <button onclick="nextCard()">Next</button>
      <button class="secondary" onclick="prevCard()">Previous</button>
      <button class="secondary" onclick="shuffleCards()">Shuffle</button>
    </div>
  </div>
</div>

// ADHD / RSD processing cards

const DECKS = {
  conversation: CONVERSATION_CARDS,
  rsd: RSD_CARDS,
  vacation: VACATION_CARDS
};

let cards = [];
let current = 0;
let followupRevealed = false;
let currentDeck = 'conversation';

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadDefault() {
  selectDeck(currentDeck);
}

function selectDeck(deck) {
  if (!DECKS[deck]) return;
  currentDeck = deck;
  cards = shuffleArray(DECKS[deck]);
  current = 0;
  followupRevealed = false;
  document.querySelectorAll('.deck-btn').forEach(btn => {
    btn.classList.toggle('is-active', btn.dataset.deck === deck);
  });
  const labels = {
    conversation: `Conversation deck (${cards.length} cards). Tap for follow-up. No right answers.`,
    rsd: `ADHD / RSD deck (${cards.length} cards). Tap for follow-up. No right answers.`,
    vacation: `Vacation deck (${cards.length} cards). Tap for follow-up. No right answers.`
  };
  document.getElementById('subtitle').textContent = labels[deck] || labels.conversation;
  showStudy();
}

function showStudy() {
  document.getElementById('studyPanel').classList.remove('hidden');
  render();
}

function render() {
  if (cards.length === 0) return;
  const card = cards[current];
  document.getElementById('questionText').textContent = card.q;
  const fu = document.getElementById('followupText');
  if (card.f) {
    fu.textContent = card.f;
    fu.classList.toggle('visible', followupRevealed);
    document.getElementById('sideLabel').textContent = followupRevealed ? "Follow-up" : "Question · tap for follow-up";
  } else {
    fu.textContent = "";
    fu.classList.remove('visible');
    document.getElementById('sideLabel').textContent = "Question";
  }
  document.getElementById('stats').textContent =
    `Card ${current + 1} of ${cards.length}`;
  document.getElementById('progressFill').style.width =
    `${((current + 1) / cards.length) * 100}%`;
}

function revealFollowup() {
  if (!cards[current]?.f) return;
  followupRevealed = !followupRevealed;
  render();
}

function nextCard() {
  current = (current + 1) % cards.length;
  followupRevealed = false;
  render();
}

function prevCard() {
  current = (current - 1 + cards.length) % cards.length;
  followupRevealed = false;
  render();
}

function shuffleCards() {
  cards = shuffleArray(cards);
  current = 0;
  followupRevealed = false;
  render();
}

document.addEventListener('keydown', (e) => {
  if (document.getElementById('studyPanel').classList.contains('hidden')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealFollowup(); }
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === 's' || e.key === 'S') shuffleCards();
});

loadDefault();
</script>
