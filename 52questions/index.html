<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation Cards</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #232734;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --accent: #6b9fff;
  --accent-hover: #5a8ae8;
  --follow: #a8b8ff;
  --border: #2e3340;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 { margin: 0 0 4px; font-size: 1.5rem; }
.subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
.container { width: 100%; max-width: 640px; }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 16px;
}
.card-box {
  background: var(--surface2);
  border-radius: 12px;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 36px 28px;
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: background 0.15s;
}
.card-box:active { background: #2a2f3d; }
.question {
  font-size: 1.35rem;
  line-height: 1.45;
  font-weight: 500;
}
.followup {
  margin-top: 20px;
  font-size: 1.05rem;
  color: var(--follow);
  line-height: 1.4;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 0.25s, max-height 0.3s;
}
.followup.visible {
  opacity: 1;
  max-height: 200px;
}
.side-label {
  position: absolute;
  top: 14px;
  left: 18px;
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: var(--accent-hover); }
button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
button.secondary:hover { background: #2a2f3d; }
.stats { color: var(--muted); font-size: 0.88rem; text-align: center; margin-bottom: 10px; }
.deck-select { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
.deck-btn {
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 16px;
  font-size: 0.88rem;
  font-weight: 600;
}
.deck-btn:hover { background: #2a2f3d; color: var(--text); }
.deck-btn.is-active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.deck-btn.is-active:hover { background: var(--accent-hover); }
.progress-bar {
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  margin: 8px 0 14px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.2s;
}
.hidden { display: none !important; }
textarea {
  width: 100%;
  min-height: 100px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 10px;
  font-family: inherit;
  font-size: 0.9rem;
  resize: vertical;
  margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="container">
  <h1>Conversation Cards</h1>
  <p class="subtitle" id="subtitle">Mixed deck (104 cards). Tap for follow-up. No right answers.</p>

  <div id="importPanel" class="panel hidden">
    <label><strong>Import your own cards (CSV or text)</strong></label>
    <p style="color:var(--muted);font-size:0.85rem;margin:6px 0 10px;">
      Format: Question,Optional follow-up<br>
      Or one question per line. Follow-up after a tab or | if you have one.
    </p>
    <textarea id="importText" placeholder="What is something you wish adults understood about being 14?,What would you like me to understand better?"></textarea>
    <div class="controls">
      <button onclick="loadFromText()">Load & Shuffle</button>
      <button class="secondary" onclick="loadDefault()">Reset to Mixed Deck</button>
    </div>
  </div>

  <div id="studyPanel" class="panel">
    <div class="deck-select" id="deckSelect" role="group" aria-label="Choose a deck">
      <button type="button" class="deck-btn" data-deck="conversation" onclick="selectDeck('conversation')">Conversation</button>
      <button type="button" class="deck-btn" data-deck="rsd" onclick="selectDeck('rsd')">ADHD / RSD</button>
      <button type="button" class="deck-btn is-active" data-deck="mixed" onclick="selectDeck('mixed')">Mixed</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="card-box" id="cardBox" onclick="revealFollowup()">
      <span class="side-label" id="sideLabel">Question</span>
      <div class="question" id="questionText"></div>
      <div class="followup" id="followupText"></div>
    </div>

    <div class="controls">
      <button onclick="nextCard()">Next</button>
      <button class="secondary" onclick="prevCard()">Previous</button>
      <button class="secondary" onclick="shuffleCards()">Shuffle</button>
      <button class="secondary" onclick="toggleImport()">Import</button>
    </div>
  </div>
</div>

<script>
// Two decks: 52 conversation cards + 52 ADHD/RSD cards = 104 combined
const CONVERSATION_CARDS = [
  { q: "What is something you wish adults understood about being 14?", f: "What would you like me to understand better?" },
  { q: "What was a small good thing about your week?", f: "What made that moment stand out?" },
  { q: "If you could plan a day with no obligations, what would you do?", f: "Would you want company, time alone, or some of both?" },
  { q: "What is something you are interested in that I know very little about?", f: "What would be a good place for me to start learning?" },
  { q: "When do you feel most like yourself?", f: "What helps you feel that comfortable?" },
  { q: "What is something you are looking forward to?", f: "What are you most excited about?" },
  { q: "What kind of humor always makes you laugh?", f: "Is there an example you would like to show me?" },
  { q: "What is a memory you wish you could experience again?", f: "What part would you most want to relive?" },
  { q: "What makes someone a good friend to you?", f: "Which quality matters most right now?" },
  { q: "How can you tell that you can trust someone?", f: "Does trust grow slowly for you, or do you usually know quickly?" },
  { q: "What helps you feel included in a group?", f: "What do people do that makes a difference?" },
  { q: "What makes a friendship feel like too much work?", f: "What would a healthier balance look like?" },
  { q: "When friends disagree, what helps them work things out?", f: "Do you prefer talking right away or having some space first?" },
  { q: "How do you feel about spending time on your own?", f: "What makes alone time enjoyable or difficult?" },
  { q: "What would you want a friend to do if someone treated you unfairly?", f: "Would you want them to speak up, check in privately, or do something else?" },
  { q: "What is something people sometimes assume about you that is wrong?", f: "What do you wish they noticed instead?" },
  { q: "What is something you like about the person you are becoming?", f: "When did you start noticing that about yourself?" },
  { q: "What have you done recently that took courage?", f: "What helped you do it?" },
  { q: "What kind of compliment feels meaningful to you?", f: "What makes it feel sincere?" },
  { q: "What helps when you start comparing yourself with other people?", f: "Is there anything adults say that makes those comparisons worse?" },
  { q: "What do you wish people valued more than appearance?", f: "Who does a good job of valuing those things?" },
  { q: "What is a skill you would like to build just for yourself?", f: "What would make trying it feel fun and low-pressure?" },
  { q: "When have you surprised yourself in a good way?", f: "Did it change what you thought you could do?" },
  { q: "What is something you wish you could stop being so hard on yourself about?", f: "What response from me would help?" },
  { q: "What part of school feels most worthwhile to you?", f: "What makes that part work well?" },
  { q: "What part of school uses up the most energy?", f: "Is it the work, the people, the schedule, or something else?" },
  { q: "If you could change one school rule, what would you change?", f: "What would you put in its place?" },
  { q: "What makes a teacher someone you can learn from?", f: "What do they do that helps you?" },
  { q: "What do grades show about you, and what do they miss?", f: "What would give a fuller picture of your effort or abilities?" },
  { q: "When you have too much to do, what helps you get started?", f: "Would you prefer help planning, company, or space?" },
  { q: "What is something you would like to learn that school does not teach?", f: "How would you want to explore it?" },
  { q: "What does a successful school year mean to you personally?", f: "What would matter besides grades?" },
  { q: "What online content usually leaves you feeling better?", f: "What do you enjoy or get from it?" },
  { q: "How can you tell when an app is taking more of your time than you want?", f: "What would help you feel more in control?" },
  { q: "What makes a group chat enjoyable, and what makes it stressful?", f: "How do you like to handle it when you need a break?" },
  { q: "What do adults misunderstand about your online life?", f: "What would you want them to ask before judging?" },
  { q: "What would make it easier to tell me about something uncomfortable online?", f: "What would you want my first response to be?" },
  { q: "How do you decide what to keep private online?", f: "What helps you feel comfortable with that decision?" },
  { q: "When you have a difficult day, what kind of support feels best?", f: "Would you like listening, distraction, advice, or something else?" },
  { q: "How can I tell when you want space and when you want me nearby?", f: "Would a simple signal or phrase help?" },
  { q: "What is something I do that helps you feel heard?", f: "What could I do more often?" },
  { q: "What is a household rule you would like us to reconsider?", f: "What would you suggest, and how could we see whether it works?" },
  { q: "What responsibility would you like more control over?", f: "What support would help you manage it yourself?" },
  { q: "When we disagree, what could I do to make the conversation more respectful?", f: "What would help us come back to it after a break?" },
  { q: "What is something you would enjoy doing together?", f: "Would you want to plan it or have me handle the details?" },
  { q: "What family tradition would you keep, change, or start?", f: "What would make it meaningful to you?" },
  { q: "What does respectful behavior look like when someone has a crush on you?", f: "What would make attention feel welcome or unwelcome?" },
  { q: "What makes it easier to say no when you do not want to do something?", f: "How could I support you without taking over?" },
  { q: "What would help you ask me for a ride out of an uncomfortable situation?", f: "What could we agree on beforehand to make that easier?" },
  { q: "What is a dream you would like to explore without having to commit to it?", f: "What would be one enjoyable way to try it out?" },
  { q: "What do you hope everyday life feels like when you are older?", f: "What matters most about that picture?" },
  { q: "What is a question you wish I would ask you?", f: "Would you like me to answer it too?" }
];

// ADHD / RSD processing cards
const RSD_CARDS = [
  { q: "What does rejection feel like in your body right now?", f: "Where do you notice it first?" },
  { q: "When did you last feel a wave of RSD?", f: "What happened right before it hit?" },
  { q: "What story does your brain tell you when someone seems distant?", f: "How often does that story turn out to be true?" },
  { q: "What would you say to a friend who felt this exact feeling?", f: "Can you offer yourself any of that kindness?" },
  { q: "Which kind of feedback is hardest for you to hear?", f: "What makes that particular feedback sting?" },
  { q: "When you feel rejected, what do you usually do next?", f: "Does that response help in the long run?" },
  { q: "What is one thing you know is true about yourself even when RSD is loud?", f: "How can you remind yourself of it?" },
  { q: "How do you tell the difference between “they’re upset with me” and “I’m interpreting it that way”?", f: "What helps you check?" },
  { q: "What support do you wish someone offered when RSD hits?", f: "How could you ask for that next time?" },
  { q: "When have you recovered from an RSD episode faster than usual?", f: "What was different that time?" },
  { q: "What part of ADHD makes RSD feel stronger for you?", f: "Is it the intensity, the rumination, or something else?" },
  { q: "What would “good enough” look like today, even if it isn’t perfect?", f: "Can you name one small version of that?" },
  { q: "How do you feel about asking for clarification instead of assuming the worst?", f: "What makes that hard or possible?" },
  { q: "What is a recent moment you took personally that might have had another explanation?", f: "What else could have been going on?" },
  { q: "What helps your nervous system calm down when the rejection feeling starts?", f: "Is there something physical that works better than thinking?" },
  { q: "Who in your life usually responds in a way that doesn’t trigger RSD?", f: "What do they do differently?" },
  { q: "What do you wish people understood about how criticism lands for you?", f: "How could you say that without defending yourself?" },
  { q: "When you replay a conversation later, what part do you usually focus on?", f: "What part do you tend to skip?" },
  { q: "What is one boundary that would protect you from unnecessary RSD triggers?", f: "What would enforcing it look like in practice?" },
  { q: "How do you feel about the idea that other people’s moods are often not about you?", f: "When has that turned out to be true?" },
  { q: "What does “I did my best with the brain I have today” mean to you?", f: "Can you apply that to something recent?" },
  { q: "What is a small success you’ve had that RSD later tried to erase?", f: "What would it look like to keep that success?" },
  { q: "How do you want to respond the next time you notice the RSD spiral starting?", f: "What is one step you could take in the first five minutes?" },
  { q: "What kind of reassurance actually helps, and what kind makes it worse?", f: "How can you tell the difference?" },
  { q: "When you feel like you failed someone, what evidence supports that and what doesn’t?", f: "Which list is longer right now?" },
  { q: "What would it look like to treat an RSD wave as temporary weather instead of a permanent truth?", f: "What might you do while you wait for it to pass?" },
  { q: "How does sleep, hunger, or sensory overload affect how strongly RSD hits you?", f: "What patterns have you noticed?" },
  { q: "What is something you appreciate about your sensitivity, even when it hurts?", f: "When has that same sensitivity been a strength?" },
  { q: "What would you like the people closest to you to do when they see you shutting down?", f: "Have you told them?" },
  { q: "How do you feel about sharing that you have ADHD and RSD with someone new?", f: "What would make that conversation feel safer?" },
  { q: "What is a recent interaction you wish you could redo with more self-compassion?", f: "What would you do differently next time, not to be perfect, but to be kinder?" },
  { q: "When the feeling of “everyone is mad at me” shows up, what usually starts it?", f: "Is there a common trigger you can watch for?" },
  { q: "What helps you stop the mental replay of a painful moment?", f: "Is there something that interrupts it reliably?" },
  { q: "How do you want to measure a good day when RSD has been present?", f: "What counts as success on those days?" },
  { q: "What is one thing you can control when someone else’s reaction feels rejecting?", f: "What is outside your control?" },
  { q: "How does comparison with other people feed your RSD?", f: "What would it look like to step out of that comparison for a little while?" },
  { q: "What would “safe enough” feel like in a conversation right now?", f: "What could help create a bit of that safety?" },
  { q: "When you apologize, do you tend to over-apologize because of RSD?", f: "What would a proportionate apology look like?" },
  { q: "What is a strength of yours that RSD sometimes makes you forget?", f: "How could you keep that strength more visible to yourself?" },
  { q: "How do you feel about taking a break from a conversation when the feelings get too big?", f: "What would make that break feel okay to you and the other person?" },
  { q: "What has someone said to you that helped an RSD episode pass more gently?", f: "Could you say something similar to yourself?" },
  { q: "What does “progress” look like with RSD for you right now?", f: "Is it fewer spirals, shorter spirals, or something else?" },
  { q: "How do you want to talk to yourself in the hour after a difficult interaction?", f: "What phrase would you actually believe?" },
  { q: "What is one low-stakes way you could practice not assuming rejection this week?", f: "What would make that experiment feel doable?" },
  { q: "When you feel the urge to withdraw completely, what need is that urge trying to meet?", f: "Is there a smaller way to meet that need?" },
  { q: "What would it mean to you if someone’s criticism was about the task, not about your worth?", f: "How could you test that idea next time?" },
  { q: "How do you feel about asking “Did I do something that bothered you?” instead of guessing?", f: "What would make that question feel safer to ask?" },
  { q: "What is something you’ve handled better recently than you would have a year ago?", f: "What does that change tell you about your capacity?" },
  { q: "What support system do you already have that RSD sometimes makes you doubt?", f: "Who or what is still there even when the feeling says otherwise?" },
  { q: "How do you want to end a day that included an RSD wave?", f: "What would help you close it without carrying it into tomorrow?" },
  { q: "What is one thing you can do today that is for you, not for how others will see it?", f: "What would make that feel worthwhile?" },
  { q: "What do you most want to remember about yourself when the rejection feeling is loudest?", f: "How can you keep that reminder close?" }
];

const DECKS = {
  conversation: CONVERSATION_CARDS,
  rsd: RSD_CARDS,
  mixed: [...CONVERSATION_CARDS, ...RSD_CARDS]
};

let cards = [];
let current = 0;
let followupRevealed = false;
let currentDeck = 'mixed';

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadDefault() {
  selectDeck(currentDeck);
}

function selectDeck(deck) {
  if (!DECKS[deck]) return;
  currentDeck = deck;
  cards = shuffleArray(DECKS[deck]);
  current = 0;
  followupRevealed = false;
  document.querySelectorAll('.deck-btn').forEach(btn => {
    btn.classList.toggle('is-active', btn.dataset.deck === deck);
  });
  const labels = {
    conversation: `Conversation deck (${cards.length} cards). Tap for follow-up. No right answers.`,
    rsd: `ADHD / RSD deck (${cards.length} cards). Tap for follow-up. No right answers.`,
    mixed: `Mixed deck (${cards.length} cards). Tap for follow-up. No right answers.`
  };
  document.getElementById('subtitle').textContent = labels[deck] || labels.mixed;
  showStudy();
}

function parseImport(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const result = [];
  for (const line of lines) {
    if (/^question/i.test(line) && /follow/i.test(line)) continue;
    let q, f = "";
    if (line.includes('\t')) {
      const parts = line.split('\t');
      q = parts[0].trim();
      f = parts.slice(1).join(' ').trim();
    } else if (line.includes('|')) {
      const parts = line.split('|');
      q = parts[0].trim();
      f = parts.slice(1).join(' ').trim();
    } else if (line.includes(',')) {
      const match = line.match(/^"?(.*?)"?\s*,\s*"?(.*?)"?$/);
      if (match) {
        q = match[1].replace(/""/g, '"').trim();
        f = match[2].replace(/""/g, '"').trim();
      } else {
        const parts = line.split(',');
        q = parts[0].trim();
        f = parts.slice(1).join(',').trim();
      }
    } else {
      q = line;
    }
    if (q) result.push({ q, f });
  }
  return result;
}

function loadFromText() {
  const text = document.getElementById('importText').value.trim();
  const parsed = parseImport(text);
  if (parsed.length === 0) {
    alert("No cards found. Paste questions (with optional follow-ups).");
    return;
  }
  cards = shuffleArray(parsed);
  current = 0;
  followupRevealed = false;
  currentDeck = 'custom';
  document.querySelectorAll('.deck-btn').forEach(btn => btn.classList.remove('is-active'));
  document.getElementById('subtitle').textContent =
    `Your deck (${cards.length} cards). Tap for follow-up. No right answers.`;
  showStudy();
}

function showStudy() {
  document.getElementById('importPanel').classList.add('hidden');
  document.getElementById('studyPanel').classList.remove('hidden');
  render();
}

function toggleImport() {
  document.getElementById('importPanel').classList.toggle('hidden');
}

function render() {
  if (cards.length === 0) return;
  const card = cards[current];
  document.getElementById('questionText').textContent = card.q;
  const fu = document.getElementById('followupText');
  if (card.f) {
    fu.textContent = card.f;
    fu.classList.toggle('visible', followupRevealed);
    document.getElementById('sideLabel').textContent = followupRevealed ? "Follow-up" : "Question · tap for follow-up";
  } else {
    fu.textContent = "";
    fu.classList.remove('visible');
    document.getElementById('sideLabel').textContent = "Question";
  }
  document.getElementById('stats').textContent =
    `Card ${current + 1} of ${cards.length}`;
  document.getElementById('progressFill').style.width =
    `${((current + 1) / cards.length) * 100}%`;
}

function revealFollowup() {
  if (!cards[current]?.f) return;
  followupRevealed = !followupRevealed;
  render();
}

function nextCard() {
  current = (current + 1) % cards.length;
  followupRevealed = false;
  render();
}

function prevCard() {
  current = (current - 1 + cards.length) % cards.length;
  followupRevealed = false;
  render();
}

function shuffleCards() {
  cards = shuffleArray(cards);
  current = 0;
  followupRevealed = false;
  render();
}

document.addEventListener('keydown', (e) => {
  if (document.getElementById('studyPanel').classList.contains('hidden')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealFollowup(); }
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === 's' || e.key === 'S') shuffleCards();
});

loadDefault();
</script>
</body>
</html>
