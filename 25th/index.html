<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25th Anniversary Trip Ideas</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --text:#e8eef7; --muted:#8b9bb4; --accent:#3d8bfd; --accent-soft:rgba(61,139,253,0.15); --border:#2a3548; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.65; padding:2rem 1rem; }
  .container { max-width:820px; margin:0 auto; }
  h1 { font-size:2.1rem; font-weight:700; margin-bottom:0.25rem; letter-spacing:-0.02em; }
  .subtitle { color:var(--muted); font-size:1.05rem; margin-bottom:2rem; }
  h2 { font-size:1.15rem; margin:0 0 0.4rem; color:var(--accent); }
  p { margin-bottom:0.9rem; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .idea-card { display:block; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem 1.4rem; margin:1rem 0; color:inherit; text-decoration:none; transition:border-color 0.15s ease; }
  .idea-card:hover { border-color:var(--accent); text-decoration:none; }
  .idea-card p { margin-bottom:0; color:var(--muted); font-size:0.98rem; }
  footer { margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--border); color:var(--muted); font-size:0.85rem; text-align:center; }
  @media (max-width:600px) { body { padding:1.25rem 0.75rem; } h1 { font-size:1.65rem; } }
</style>
</head>
<body>
<div class="container">
  <h1>25th Anniversary Trip Ideas</h1>
  <p class="subtitle">Notes and itineraries for a slower-paced anniversary trip.</p>

  <a class="idea-card" href="greece/">
    <h2>Greece</h2>
    <p>A slower-paced 20–21 day plan: a short Athens stop for the Acropolis, a long Skiathos base, then a second island or mainland option.</p>
  </a>

  <footer>
    25th Anniversary Trip Ideas
  </footer>
</div>
</body>
</html>
